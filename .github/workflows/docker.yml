name: Docker Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t fintech-api --file apps/api/Dockerfile .

      - name: Build Web image
        run: docker build -t fintech-web --file apps/web/Dockerfile .
